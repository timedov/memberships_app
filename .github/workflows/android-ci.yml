name: Android CI

on:
  push:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/android-sdk" >> $GITHUB_ENV
          echo "/usr/local/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Insert google-services.json from Secrets
        run: |
          mkdir -p app/src
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/src/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the Project
        run: ./gradlew clean build

      - name: Run Lint Checks
        run: ./gradlew lint

      - name: Run Detekt
        run: ./gradlew detekt
